<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08141a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Enviro Study App</title>
<style>
html,body{height:100%;margin:0;background:#08141a;color:#d8e8ec;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.views{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#08141a;display:none}
iframe.on{display:block}
nav{display:flex;border-top:1px solid #1e3844;background:#0e1f27;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:#86a2ab;padding:14px 8px;font:600 .95rem system-ui,sans-serif;cursor:pointer}
nav button.on{color:#4cc9f0;box-shadow:inset 0 2px 0 #4cc9f0}
nav button:focus-visible{outline:2px solid #4cc9f0;outline-offset:-4px}
#bar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#0e1f27;border-bottom:1px solid #1e3844;padding:6px 12px;font-size:.85rem;color:#86a2ab}#bar[hidden]{display:none}#bar button{background:#4cc9f0;color:#06222c;border:0;border-radius:6px;padding:5px 12px;font-weight:600;cursor:pointer}#bar button[hidden]{display:none}
.r{display:flex;gap:8px}#syncbtn{background:none!important;color:#4cc9f0!important;border:1px solid #1e3844!important}
dialog{background:#0e1f27;color:#d8e8ec;border:1px solid #1e3844;border-radius:10px;width:340px;max-width:92vw;padding:18px}dialog::backdrop{background:#000b}dialog input{width:100%;margin:6px 0;padding:10px;background:#08141a;color:inherit;border:1px solid #1e3844;border-radius:6px;font:inherit}dialog .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}dialog button{background:none;color:#d8e8ec;border:1px solid #1e3844;border-radius:6px;padding:8px 12px;font:600 .9rem system-ui;cursor:pointer}dialog button.p{background:#4cc9f0;color:#06222c;border-color:#4cc9f0}#acctmsg{color:#ffb454;font-size:.85rem;min-height:1.2em}
</style>
</head>
<body>
<div id="bar"><span id="msg">Enviro Study</span><span class="r"><button id="syncbtn">Sync: off</button><button id="inst" hidden>Install app</button></span></div>
<div class="views">
  <iframe id="notes" class="on" src="board.html" title="Study notes"></iframe>
  <iframe id="tracker" title="GATE tracker"></iframe>
  <iframe id="gate" title="GATE 2027 guide"></iframe>
</div>
<nav>
  <button data-t="notes" class="on">Notes</button>
  <button data-t="tracker">Tracker</button>
  <button data-t="gate">GATE 2027</button>
</nav>
<script>
const nav=document.querySelector('nav');
function show(t){
  document.querySelectorAll('iframe').forEach(f=>f.classList.toggle('on',f.id===t));
  nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  const f=document.getElementById(t);
  const u={tracker:'tracker.html',gate:'gate.html'}[t];if(u&&!f.getAttribute('src'))f.src=u;
  try{localStorage.setItem('shell-tab',t)}catch(e){}
}
nav.addEventListener('click',e=>{const t=e.target.dataset.t;if(t)show(t)});
let last='notes';try{last=localStorage.getItem('shell-tab')||'notes'}catch(e){}
show(last);
const bar=document.getElementById('bar'),msg=document.getElementById('msg'),inst=document.getElementById('inst');let dp=null;
function sync(){const off=!navigator.onLine;msg.textContent=off?'Offline. Your data is saved on this device.':(dp?'Install this app for quick access.':'Enviro Study');inst.hidden=!dp;bar.hidden=false}
addEventListener('online',sync);addEventListener('offline',sync);
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;sync()});
inst.addEventListener('click',async()=>{if(!dp)return;dp.prompt();await dp.userChoice;dp=null;sync()});
addEventListener('appinstalled',()=>{dp=null;sync()});sync();
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
<dialog id="acct"><h3 style="margin:0 0 6px">Sync account</h3><p id="who" style="margin:0 0 8px;font-size:.9rem;color:#86a2ab"></p>
<div id="authform"><input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
<div class="row"><button class="p" id="signin">Sign in</button><button id="create">Create account</button></div></div>
<p id="acctmsg"></p><div class="row"><button id="signout" hidden>Sign out</button><button id="close">Close</button></div></dialog>
<script type="module" src="sync.js"></script>
</body>
</html>
